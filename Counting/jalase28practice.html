<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>
    <link rel="stylesheet" href="jalase28practice.css" />
  </head>
  <body>
    <div class="countdown" id="timeup">
      <p class="label">TIME LEFT</p>

      <div class="time">
        <div class="time-box">
          <span id="days">00</span>
          <small>Days</small>
        </div>

        <div class="time-box">
          <span id="hours">00</span>
          <small>Hours</small>
        </div>

        <div class="time-box">
          <span id="minutes">00</span>
          <small>Minutes</small>
        </div>

        <div class="time-box">
          <span id="seconds">00</span>
          <small>Seconds</small>
        </div>
      </div>

      <div class="controls">
        <button id="start">▶ Start</button>
        <button id="pause">⏸ Pause</button>
        <button id="reset">↻ Reset</button>
      </div>
    </div>

    <script src="jalase28practice.js"></script>
  </body>
</html>
